services:
  - type: web
    name: aipr-review-agent
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash scripts/start_render.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TIGER_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: aipr-review-queue
          type: keyvalue
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: HITL_CONFIDENCE_THRESHOLD
        value: "0.93"
      - key: MCP_SHARED_SECRET
        sync: false
      # Not a secret — the mcp SDK's Host-header allowlist. Must include the
      # real deployed hostname or every production /mcp request 421s; see
      # Settings.mcp_allowed_hosts.
      - key: MCP_ALLOWED_HOSTS
        value: "aipr-review-agent.onrender.com"
      - key: DAILY_BUDGET_USD
        value: "5.0"
      - key: AIPR_LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: aipr-review-agent

  - type: keyvalue
    name: aipr-review-queue
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (free-tier demo queue, no sensitive data)
