name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipr_review
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6480:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Type check
        run: mypy backend
      - name: Check formatting
        run: black --check backend scripts
      - name: Run full test suite
        run: pytest -q --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - name: Report test counts
        if: always()
        run: |
          python - "$RUNNER_TEMP/pytest-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
          if not report.exists():
              print("Test counts unavailable: pytest did not produce a JUnit report.")
              raise SystemExit(0)

          cases = ET.parse(report).getroot().findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          passed = len(cases) - skipped - failed - errors
          print(
              f"Test counts: collected/executed={len(cases)}, passed={passed}, "
              f"skipped={skipped}, failed={failed + errors}"
          )
          PY

  notify-on-failure:
    if: >-
      ${{
        always() &&
        needs.checks.result == 'failure' &&
        (github.event_name == 'push' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify repository owner about CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const subject = pullRequest
              ? `PR #${pullRequest.number} (${pullRequest.head.sha.slice(0, 7)})`
              : `commit ${context.sha.slice(0, 7)}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI failure] ${subject}`,
              body: [
                `The required CI workflow failed for ${subject}.`,
                ``,
                `Run: ${runUrl}`,
                `Commit: ${context.sha}`,
                ``,
                `This notification was created by the CI workflow and assigned to the repository owner.`,
              ].join("\n"),
              assignees: [context.repo.owner],
            });
            core.notice(`Failure notification created as issue #${issue.data.number} and assigned to ${context.repo.owner}.`);
